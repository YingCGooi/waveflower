<!doctype html>
<html>
  <head>
    <title>
      Waveflower: Radial audio signal visualization - @strudel/repl available with respect to AGPL-3.0 license
    </title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="https://waveflower.org/assets/icons/waveflower_icon_aligned.png" type="image/png" />
    <link rel="stylesheet" href="./stylesheets/style.css" />
    <link rel="stylesheet" href="/app/stylesheets/style.css" />
  </head>

  <body>
    <script src="https://colorjs.io/dist/color.global.js"></script>
    <!-- use "/color.global.min.js" for production -->
    <script>
      var params = new URLSearchParams(window.location.search);
      if (params.get('repl') !== 'false') {
        const strudel = document.createElement('script');
        strudel.src = 'https://unpkg.com/@strudel/repl@latest';
        document.body.appendChild(strudel);
      }
    </script>
    <script src="/app/scripts/util.js"></script>
    <section class="interface">
      <nav class="icon">
        <a href="https://waveflower.org">
          <img class="icons" src="https://waveflower.org/assets/icons/waveflower_icon_sine_tri.png"
        /></a>
      </nav>
      <form id="waveform">
        <a class="mobile-icon" href="https://waveflower.org">
          <img src="https://waveflower.org/assets/icons/waveflower_icon_sine_tri.png"
        /></a>
        <label title="Sine"><i aria-label="sine">∿</i><input checked type="radio" name="osc" value="sine" /></label>
        <label title="Triangle"
          ><i aria-label="triangle">⋀⋀</i><input type="radio" name="osc" value="triangle"
        /></label>
        <label title="Square"><i aria-label="square">_⊓</i><input type="radio" name="osc" value="square" /></label>
        <label title="Sawtooth"
          ><i aria-label="sawtooth">⩘⩘</i><input type="radio" name="osc" value="sawtooth"
        /></label>
        <label title="Set oscillator frequency (Hz)">
          <small>ⓘ</small><strong>OSC</strong>
          <input type="number" name="freq" value="220" min="1" max="16000" placeholder="Hz" />
        </label>
        <label title="Set base period interval (1/s)">
          <small>ⓘ</small><strong>BASE</strong>
          <select id="base-select" name="base"></select>
          <script>
            for (let i = 33; i < 70; i++) {
              const f = midiToFreq(i);
              const n = midiToNote(i);
              const o = document.createElement('option');
              o.value = f.toFixed(2);
              o.innerHTML = `${n} ${Math.round(f)}/s`;
              $('[name=base]').appendChild(o);
            }
          </script>
        </label>
      </form>
      <fieldset>
        <button id="play">Play</button>
        <button id="stop">Stop</button>
      </fieldset>
      <input id="fileinput" type="file" accept="*" />
      <nav>
        <a href="https://github.com/YingCGooi/waveflower/blob/main/LICENSE">
          <span class="flip">⇱</span> view AGPL-3.0 license + source
        </a>
      </nav>
    </section>
    <section id="canvases"><!-- all canvases go in here --></section>
    <strudel-editor id="repl"></strudel-editor>
  </body>
  <script src="/app/scripts/wave.js"></script>
  <script src="/app/scripts/handlers.js"></script>
  <link rel="stylesheet" href="/app/stylesheets/override.css" />
</html>
