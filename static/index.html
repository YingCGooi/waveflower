<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waveflower by Gooi</title>
    <link rel="icon" href="../assets/r=sin2t.png" type="image/png" />
    <!-- <link rel="stylesheet" href="./style.css" /> -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --text-color: oklch(0.97 0.01 240/0.8);
        --muted-accent: oklch(0.4 0.15 240);
        --accent-color: oklch(0.77 0.17 240);
        --highlight-accent: oklch(0.9 0.17 240);
        --strong: oklch(0.8 0.2 230);
      }
      .gap {
        height: 0px;
      }
      body {
        background: oklch(0.1 0.02 255);
        color: var(--text-color);
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        font-family: 'Google Sans Code', monospace;
        letter-spacing: -0.1rem;
        row-gap: 36px;
      }
      header,
      main {
        border-left: 0.4rem solid var(--muted-accent);
        border-radius: 0.7rem;
        background: oklch(from var(--muted-accent) 0.3 0.02 h / 0.5);
        width: 800px;
        max-width: 900px;
      }
      h3,
      h4 {
        font-weight: 300;
        font-size: 4rem;
        color: var(--accent-color);
        display: flex;
        align-items: center;
        padding: 24px 36px;
      }
      h4 {
        padding: 0;
        font-size: 3rem;
        font-weight: 400;
      }
      img#waveflower-icon {
        width: 84px;
        height: 84px;
        display: inline-block;
        margin-right: 6px;
        mix-blend-mode: lighten;
      }
      p {
        margin-top: 12px;
        font-weight: 200;
        font-size: 1.33rem;
        letter-spacing: -0.02rem;
      }
      strong {
        font-weight: 500;
        color: var(--strong);
      }
      section {
        padding: 24px 36px;
      }
    </style>
  </head>
  <body>
    <div class="gap"></div>
    <header>
      <h3>
        <img id="waveflower-icon" src="../assets/waveflowericon.webp" />
        <strong>Gooi</strong>.waveflower
      </h3>
    </header>
    <main>
      <section>
        <h4>about()</h4>
        <p id="about"></p>
      </section>
    </main>
  </body>
  <script>
    class Text {
      constructor(text = '') {
        this.text = text;
      }
      toString() {
        return this.text;
      }
      type() {
        return 'String';
      }
      toHTML() {
        return '<p>' + this.text + '</p>';
      }
    }
    class Gooi {
      static waveflower = 'https://waveflower.org/assets/waveflowericon.webp';
      constructor() {
        this.about = new Text(
          'Waveflower.org is an educational visualization platform for music theory and audio signal processing.',
        );
      }
      about() {
        return this.about;
      }
      background() {
        return new Text();
      }
    }

    const gooi = new Gooi();
    for (k in gooi) {
      document.querySelector('#' + k).innerHTML = gooi[k].toHTML();
    }
  </script>
</html>
