<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waveflower by Gooi</title>
    <link rel="icon" href="../assets/r=sin2t.png" type="image/png" />
    <!-- <link rel="stylesheet" href="./style.css" /> -->
    <style>
      :root {
        --text-color: #fff;
        --muted-accent: oklch(0.4 0.15 255);
        --accent-color: oklch(0.77 0.17 255);
        --highlight-accent: oklch(0.9 0.17 255);
      }
      body {
        background: #001;
        color: var(--text-color);
        display: flex;
        justify-content: center;
        font-family: 'Google Sans Code', monospace;
        letter-spacing: -0.1rem;
      }
      h3 {
        font-weight: 300;
        font-size: 4rem;
        color: var(--accent-color);
        display: flex;
        align-items: center;
        border-left: 0.4rem solid var(--muted-accent);
        border-radius: 0.7rem;
        margin: 24px 0;
        padding: 24px 0;
      }
      img#waveflower-icon {
        width: 70px;
        height: 70px;
        display: inline-block;
        margin: 0px 12px;
        padding: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <h3>
        <img id="waveflower-icon" src="../assets/waveflowericon.webp" />
        [Waveflower] Gooi
      </h3>
    </header>
    <main></main>
  </body>
</html>
