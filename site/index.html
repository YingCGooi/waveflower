<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waveflower by Gooi</title>
    <link rel="icon" href="../assets/r=sin2t.png" type="image/png" />
    <!-- <link rel="stylesheet" href="./style.css" /> -->
    <link type="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="gap"></div>
    <header>
      <h3>
        <img id="waveflower-icon" src="../assets/waveflowericon.webp" />
        <strong>Gooi</strong>.waveflower
      </h3>
    </header>
    <main>
      <section>
        <h4>about()</h4>
        <p id="about"></p>
      </section>
    </main>
  </body>
  <script>
    class Text {
      constructor(text = '') {
        this.text = text;
      }
      toString() {
        return this.text;
      }
      type() {
        return 'String';
      }
      toHTML() {
        return '<p>' + this.text + '</p>';
      }
    }
    class Gooi {
      static waveflower = 'https://waveflower.org/assets/waveflowericon.webp';
      constructor() {
        this.about = new Text(
          'Waveflower.org is an educational visualization platform for music theory and audio signal processing.',
        );
      }
      about() {
        return this.about;
      }
      background() {
        return new Text();
      }
    }

    const gooi = new Gooi();
    for (k in gooi) {
      document.querySelector('#' + k).innerHTML = gooi[k].toHTML();
    }
  </script>
</html>
